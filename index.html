<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    /* .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); } */
    html,
    body,
    .attribution {
      height: 100%;
    }
    body {
      margin: 0;
    }

    .attribution {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgb(201, 230, 242);
    }
    .attribution .card-container  {
      background-color: #FFFFFF;
      border-radius: 8px;
      display: flex;
      flex-flow: column;
      gap: 16px;
      align-items: center;
      padding: 14px;
      width: 13em;
    }
    .attribution .card-container .qr-code-img-frame   {
      background-color: #FFFFFF;
      border-radius: 8px;
      overflow: hidden;
    }
    .attribution .qr-code-img-frame img {
     width: 100%;
     height: 100%;
    }
    .attribution .card-container .text-section {
      display: flex;
      flex-flow: column;
      align-items: center;
      font-family: system-ui;
      text-align: center;
      gap: 16px;
    }
    .attribution .card-container .text-section .title {
      font-weight: 700;
    }
    .attribution .card-container .text-section .description {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>
<body>
<!-- 
  Improve your front-end skills by building projects

  Scan the QR code to visit Frontend Mentor and take your coding skills to the next level -->
  
  <div class="attribution">
    <!-- Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>. -->
    <div class="card-container">
      <div class="qr-code-img-frame">
        <img  src="images/image-qr-code.png" />
      </div>

      <div class="text-section">
        <div class="title">Improve you front-end skills by building projects</div>
        <div class="description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</div>
      </div>

    </div>
  </div>
</body>
</html>
